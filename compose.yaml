services:
  app:
    build:
      context: .
      args:
        BUILD_REVISION: ${BUILD_REVISION:-unknown}
    env_file: .env
    environment:
      DATA_DIR: /app/.data
      PORT: '8000'
    ports:
      - '127.0.0.1:18729:8000'
    volumes:
      - financial-data:/app/.data
      - financial-temporary:/tmp/stmrep
    cpus: 2
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 150s
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    read_only: true
    init: true
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  financial-data:
  financial-temporary:
