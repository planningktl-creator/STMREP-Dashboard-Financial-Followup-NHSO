[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stmrep-financial-followup"
version = "0.2.0rc1"
requires-python = ">=3.11"
description = "Hospital HIS–REP–STM financial follow-up with source-attributed observations"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "python-multipart>=0.0.20,<1", "xlrd==2.0.2", "requests>=2.32,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "playwright>=1.50,<2", "PyYAML>=6,<7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["financial*", "repstm*"]

[tool.setuptools.package-data]
financial = ["*.json", "*.sql"]
repstm = ["*.json", "*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
