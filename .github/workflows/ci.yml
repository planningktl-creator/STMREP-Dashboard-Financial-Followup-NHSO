name: STMREP build and acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect publishing candidates
        run: python -m scripts.check_release
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
      - name: Tests and frontend build
        run: |
          python -m pytest -q
          npm run build
          node frontend/scripts/check-launch.mjs
          node frontend/scripts/check-api.mjs
      - name: Docker build
        run: docker build --build-arg BUILD_REVISION=${{ github.sha }} -t stmrep:release-test .
      - name: SQL, container, restart and backup acceptance
        run: python -m scripts.deployment_smoke
      - name: Browser Session and case smoke
        run: |
          python -m playwright install --with-deps chromium
          python -m scripts.browser_smoke
      - name: Five users during real synthetic XLS import
        run: python -m scripts.performance_check --enforce --keep-database
      - name: Explain measured queries
        run: python -m scripts.query_benchmark
      - name: Record degraded gateway separately
        run: python -m scripts.performance_check --label slow-gateway --gateway-delay 0.6 --iterations 2 --enforce --keep-database
      - name: Near-limit file on temporary disk
        run: python -m scripts.performance_check --label large-file --pad-file-mib 99 --import-rows 40 --iterations 2 --enforce --keep-database
      - name: Clean disposable database
        if: always()
        run: docker compose -p stmrep-perf-test -f deploy/compose.test.yaml down --volumes --remove-orphans
      - name: Synthetic acceptance and performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-acceptance-${{ github.sha }}
          path: |
            .ci/*result.json
            .ci/SQL_INTEGRATION_RESULT.json
            .ci/performance-*.json
            .ci/query-benchmark.json
            .ci/optimized-*.png
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
