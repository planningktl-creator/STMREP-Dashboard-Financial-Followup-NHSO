name: STMREP build and acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Inspect publishing candidates
        run: python -m scripts.check_release
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation .
          npm --prefix frontend ci
      - name: Tests and frontend build
        run: |
          python -m pytest -q
          node frontend/scripts/check-launch.mjs
          npm --prefix frontend run build
      - name: Docker build
        run: docker build -t stmrep:release-test .
      - name: SQL, container, restart and backup acceptance
        run: python -m scripts.deployment_smoke
      - name: Browser Session and case smoke
        run: |
          python -m playwright install --with-deps chromium
          python -m scripts.browser_smoke
